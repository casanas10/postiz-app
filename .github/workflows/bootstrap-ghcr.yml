name: Initialize private Postiz GHCR package

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'After owner approval, enter ghcr.io/casanas10/postiz-app'
        type: string
        required: true
      owner_checked_at:
        description: 'UTC timestamp of successful owner-authenticated package absence check (within 10 minutes)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: postiz-ghcr-bootstrap
  cancel-in-progress: false

jobs:
  initialize:
    # This workflow must first land on main with the read-only PR workflow.
    if: >-
      github.repository == 'casanas10/postiz-app' &&
      github.ref == 'refs/heads/main' &&
      inputs.package == 'ghcr.io/casanas10/postiz-app' &&
      vars.POSTIZ_GHCR_APPROVED == 'ghcr.io/casanas10/postiz-app:private'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      BOOTSTRAP_IMAGE: ghcr.io/casanas10/postiz-app:bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
      OWNER_CHECKED_AT: ${{ inputs.owner_checked_at }}
    steps:
      - name: Require a fresh owner-authenticated absence check
        run: |
          # The Actions token's account-wide listing returns HTTP 400 here.
          # The dispatcher must first use the owner's approved read scope to
          # obtain a successful complete listing with no postiz-app package.
          # A failed request or a 404 alone is not an absence check.
          [[ "$OWNER_CHECKED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          checked_epoch=$(date --date="$OWNER_CHECKED_AT" +%s)
          age=$(( $(date +%s) - checked_epoch ))
          test "$age" -ge 0
          test "$age" -le 600
          printf 'Owner verified package absence at %s\n' "$OWNER_CHECKED_AT" >> "$GITHUB_STEP_SUMMARY"
      - name: Build public-text-only bootstrap marker
        run: |
          test "$(uname -m)" = aarch64
          mkdir bootstrap-context
          printf 'Private Postiz registry initialization marker; not a runnable release.\n' > bootstrap-context/README.txt
          cat > bootstrap-context/Dockerfile <<'DOCKERFILE'
          FROM scratch
          LABEL org.opencontainers.image.source="https://github.com/casanas10/postiz-app"
          LABEL org.opencontainers.image.description="Registry setup marker; not a Postiz release"
          COPY README.txt /README.txt
          DOCKERFILE
          docker build --tag "$BOOTSTRAP_IMAGE" bootstrap-context
      - name: Initialize package with short-lived workflow credentials
        run: |
          # GitHub documents private as the initial package visibility.
          # Only this public marker is uploaded before checking the actual visibility.
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$BOOTSTRAP_IMAGE"
      - name: Require private visibility and correct repository linkage
        run: |
          gh api users/casanas10/packages/container/postiz-app \
            --jq 'select(.visibility == "private" and .repository.full_name == "casanas10/postiz-app") | .name' > verified-package.txt
          test "$(cat verified-package.txt)" = postiz-app
          printf 'Verified private package: ghcr.io/casanas10/postiz-app\nLinked repository: casanas10/postiz-app\nMarker: %s\nNo Postiz runtime was published by this workflow.\n' "$BOOTSTRAP_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign out
        if: always()
        run: docker logout ghcr.io
