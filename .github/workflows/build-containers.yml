name: Postiz ARM64 runtime

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the tested image after private GHCR setup has been approved'
        type: boolean
        default: false
  push:
    branches: [codex/postiz-arm64-runtime]
    paths:
      - Dockerfile.runtime
      - .dockerignore
      - var/docker/**
      - .github/workflows/build-containers.yml

permissions:
  contents: read

concurrency:
  group: postiz-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'casanas10/postiz-app'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      POSTIZ_TEST_IMAGE: postiz-runtime:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify native architecture and capacity
        run: |
          test "$(uname -m)" = aarch64
          df -h .
          docker info --format '{{.Architecture}}'
      - name: Build runtime from locked dependencies
        run: |
          docker buildx build --platform linux/arm64 --file Dockerfile.runtime \
            --target runtime --load --tag "$POSTIZ_TEST_IMAGE" \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-arg "NEXT_PUBLIC_VERSION=$(cat version.txt)" .
      - name: Validate native modules and isolated application
        run: bash var/docker/runtime/smoke.sh
      - name: Record candidate size and provenance
        run: |
          docker image inspect "$POSTIZ_TEST_IMAGE" \
            --format 'Image={{.Id}} Architecture={{.Architecture}} SizeBytes={{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
          docker run --rm --network none --entrypoint sh "$POSTIZ_TEST_IMAGE" \
            -c 'du -sk /app /app/node_modules /app/apps/frontend/.next; node --version' | tee -a "$GITHUB_STEP_SUMMARY"
          docker image history --no-trunc --human=false --format '{{.Size}}' "$POSTIZ_TEST_IMAGE" | awk '{total += $1} END {printf "UncompressedLayerBytes=%.0f\n", total}' | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'Source: %s\nPublish: disabled unless separately approved and requested.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: validate
    # Set this variable only after action-time approval of package creation/linking.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      github.repository == 'casanas10/postiz-app' &&
      vars.POSTIZ_GHCR_APPROVED == 'ghcr.io/casanas10/postiz-app:private'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      POSTIZ_TEST_IMAGE: ghcr.io/casanas10/postiz-app:sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require an existing verified private package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail closed on 403/404. Never assume a missing response means a new package.
          gh api users/casanas10/packages/container/postiz-app \
            --jq 'select(.visibility == "private" and .repository.full_name == "casanas10/postiz-app") | .name' > package-name.txt
          test "$(cat package-name.txt)" = postiz-app
      - name: Build and test the exact image to publish
        run: |
          test "$(uname -m)" = aarch64
          docker buildx build --platform linux/arm64 --file Dockerfile.runtime \
            --target runtime --load --tag "$POSTIZ_TEST_IMAGE" \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-arg "NEXT_PUBLIC_VERSION=$(cat version.txt)" .
          bash var/docker/runtime/smoke.sh
      - name: Sign in with the short-lived workflow token
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish immutable release tag and record digest
        run: |
          docker push "$POSTIZ_TEST_IMAGE"
          docker image inspect "$POSTIZ_TEST_IMAGE" \
            --format 'Image={{.Id}} SizeBytes={{.Size}} Digests={{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          printf 'Source: %s\nTag: %s\nProduction deployment requires separate approval.\n' "$GITHUB_SHA" "$POSTIZ_TEST_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Check private visibility after publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api users/casanas10/packages/container/postiz-app --jq .visibility)" = private
      - name: Sign out
        if: always()
        run: docker logout ghcr.io
