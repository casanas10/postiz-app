name: Check runtime packaging on PRs
on:
  pull_request:
    paths:
      - Dockerfile.runtime
      - .dockerignore
      - var/docker/**
      - .github/workflows/**
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          sh -n var/docker/runtime/start.sh
          bash -n var/docker/runtime/smoke.sh var/docker/docker-build.sh
          node --check var/docker/runtime/check.cjs
          node --check var/docker/runtime/http-check.cjs
          node --check var/docker/runtime/ecosystem.config.cjs
          docker buildx build --check --file Dockerfile.runtime .
